name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alpha_test
          POSTGRES_PASSWORD: alpha_test
          POSTGRES_DB: alpha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpha_test -d alpha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://alpha_test:alpha_test@127.0.0.1:5432/alpha_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build

  docker:
    name: docker build (api, worker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    strategy:
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: false
          tags: sports-prediction-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
